[APP]
agent_engine=n8n
n8n_timeout_seconds=185
langgraph_model_provider=groq
langgraph_model=openai/gpt-oss-120b
generation_max_output_tokens=16384
generation_temperature=0.2
generation_timeout_seconds=180
requests_per_minute=60
max_request_body_bytes=131072
telemetry_enabled=false
telemetry_payload_mode=metadata
telemetry_max_field_size=16384
n8n_scout_webhook_url=http://13.201.32.120:5678/webhook/scout
n8n_meridian_webhook_url=http://13.201.32.120:5678/webhook/meridian
n8n_guide_webhook_url=http://13.201.32.120:5678/webhook/guide
n8n_atlas_webhook_url=http://13.201.32.120:5678/webhook/atlas
; travelpayouts_timeout_seconds and travelpayouts_currency use built-in
; defaults (10s, USD) when unset here.
; AVIASALES_API_TOKEN (the flight-search provider's access token, key
; "aviasales_api_token") and TRAVELPAYOUTS_PARTNER_ID must be supplied via
; environment variables, never committed to this file.
