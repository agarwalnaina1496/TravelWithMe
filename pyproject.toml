# TWM-223: architecture fitness config. There is no packaging here — this
# file exists only to hold the ruff and import-linter contracts that CI
# enforces (see .github/workflows/ci-runner.yaml and the "Architecture
# rules (enforced)" section of AGENTS.md).

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["venv", "migrations", "n8n", "tests"]

[tool.ruff.lint]
# Deliberately narrow: this is a *caps* config, not a style pass. Only the
# rules that catch god functions / scattered logic — the tree has never
# been style-linted and turning on E/W here would be noise, not signal.
#
# PLR0913 (too many arguments) is intentionally NOT enforced: ~20
# repository-Protocol and composer signatures legitimately take 7–10 args,
# and rewriting them to parameter objects is its own effort, not this
# story's. "A 7th positional arg is a pass-an-object signal" stays a review
# guideline (see AGENTS.md).
select = ["C901", "PLR0912", "PLR0915"]

[tool.ruff.lint.mccabe]
# Cyclomatic complexity. Ratchet target ~10; the value here is the current
# ceiling — raise it only to un-break a first CI run, then walk it back
# down, never up. Three functions carry an explicit `# noqa: C901` +
# reason (two status-discriminator validators, one date-precision
# composer).
max-complexity = 12

[tool.ruff.lint.pylint]
max-branches = 15    # PLR0912
max-statements = 60  # PLR0915 — a function-size proxy

[tool.importlinter]
root_package = "twm"

[[tool.importlinter.contracts]]
name = "Layered architecture (routers -> services -> persistence -> schemas)"
type = "layers"
layers = [
    "twm.routers",
    "twm.services",
    "twm.persistence",
    "twm.schemas",
]
# telemetry, trust_boundary, shared, dependencies, middleware, auth, prompts
# are cross-cutting and unconstrained by the stack.
ignore_imports = [
    # PRE-EXISTING DEBT (TWM-223 ratchet, not a new allowance):
    # persistence.postgres lazy-imports canonical_state / touched_branches
    # from the service layer to compute touched branches on a fresh-trip
    # write. Push that computation down (or into the service) in a
    # follow-up, then delete this line.
    "twm.persistence.postgres -> twm.services.trip_commands.state",
]

[[tool.importlinter.contracts]]
name = "Routers touch only the persistence service surface, not its internals"
type = "forbidden"
source_modules = ["twm.routers"]
forbidden_modules = ["twm.persistence.postgres"]
